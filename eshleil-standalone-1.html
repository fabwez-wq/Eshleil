<style>
:root{
  --navy:#141b26; --navy2:#1c2534; --accent:#3a5a8c; --accent-dk:#2c4569; --bg:#f4f5f7; --panel:#fff;
  --ink:#1b2028; --sub:#6b7280; --line:#e2e4e9; --danger:#a83a30; --good:#2f6b4f; --warn:#8a6a1f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12151b;--panel:#1b1f28;--ink:#eef0f4;--sub:#9aa1b0;--line:#2a2f3a;}
}
:root[data-theme="dark"]{--bg:#12151b;--panel:#1b1f28;--ink:#eef0f4;--sub:#9aa1b0;--line:#2a2f3a;}
*{box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}
input,select,textarea{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100%}
aside{width:230px;max-width:80vw;background:var(--navy);color:#dbe4f5;flex-shrink:0;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;z-index:30;padding-top:env(safe-area-inset-top,0px)}
aside.open{transform:translateX(0)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
.scrim.show{display:block}
@media(min-width:900px){
  aside{transform:translateX(0);max-width:230px}
  .scrim{display:none!important}
}
.logo{display:flex;align-items:center;gap:10px;padding:19px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo-mark{width:32px;height:32px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:#fff;flex-shrink:0}
.logo-text{font-weight:600;font-size:13.5px;line-height:1.3;color:#eef1f6;letter-spacing:.01em}
nav{flex:1;padding:8px 8px;overflow-y:auto}
nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:none;background:transparent;color:#a7b0c2;border-radius:7px;font-size:13.5px;text-align:left;margin-bottom:1px;font-weight:500;letter-spacing:.01em}
nav button .ic{width:17px;height:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
nav button .ic svg{width:17px;height:17px}
nav button.active{background:var(--accent);color:#fff}

/* ===== REST API layer (Google Apps Script backend) ===== */
let API_URL = localStorage.getItem('eshleil_api_url') || '';
let API_TOKEN = localStorage.getItem('eshleil_api_token') || '';
let pollTimer = null;
const snapshotCallbacks = {}; // key -> {type:'collection'|'doc', name, id, cb}
let cache = { products:[], clients:[], quotes:[], settings:[], app_users:[], activity_log:[] };

const api = {
  async listAll(){
    const res = await fetch(API_URL + '?action=listAll&token=' + encodeURIComponent(API_TOKEN));
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  },
  async call(body){
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({token:API_TOKEN}, body))
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    return data;
  },
  async add(sheet,data){ const r = await api.call({action:'add', sheet, data}); return r.id; },
  update(sheet,id,data){ return api.call({action:'update', sheet, id, data}); },
  setById(sheet,id,data){ return api.call({action:'setById', sheet, id, data}); },
  remove(sheet,id){ return api.call({action:'delete', sheet, id}); }
};

async function loadAllAndNotify(){
  let data;
  try{ data = await api.listAll(); }
  catch(e){ console.error(e); showConnError(e.message); return false; }
  cache.products = data.products||[];
  cache.clients = data.clients||[];
  cache.quotes = data.quotes||[];
  cache.settings = data.settings||[];
  cache.app_users = data.app_users||[];
  cache.activity_log = data.activity_log||[];
  Object.values(snapshotCallbacks).forEach(entry=>{
    if(entry.type==='collection'){
      const docs = (cache[entry.name]||[]).map(o=>({id:o.id, data:()=>o}));
      entry.cb({docs});
    } else {
      const found = (cache[entry.name]||[]).find(o=>o.id===entry.id);
      entry.cb({ exists: !!found, data: ()=> found||{} });
    }
  });
  return true;
}

function showConnError(msg){
  const el = $('#gateErr');
  if(el) el.textContent = (settings.lang==='en'?'Connection error: ':'Erreur de connexion : ')+msg;
}

/* Firestore-like shim so the rest of the app's code (db.collection/db.doc) needs no changes */
function makeDbShim(){
  return {
    collection(name){
      return {
        add: async (data) => { const id = await api.add(name, data); await loadAllAndNotify(); return {id}; },
        onSnapshot: (cb) => { snapshotCallbacks[name+':col'] = {type:'collection', name, cb}; cb({docs:(cache[name]||[]).map(o=>({id:o.id,data:()=>o}))}); }
      };
    },
    doc(path){
      const idx = path.indexOf('/');
      const name = idx===-1?path:path.slice(0,idx);
      const id = idx===-1?'':path.slice(idx+1);
      return {
        update: async (data) => { await api.update(name, id, data); await loadAllAndNotify(); },
        set: async (data) => { await api.setById(name, id, data); await loadAllAndNotify(); },
        delete: async () => { await api.remove(name, id); await loadAllAndNotify(); },
        onSnapshot: (cb) => {
          snapshotCallbacks[name+':doc:'+id] = {type:'doc', name, id, cb};
          const found = (cache[name]||[]).find(o=>o.id===id);
          cb({ exists: !!found, data: ()=> found||{} });
        }
      };
    }
  };
}
/* ===== end REST API layer ===== */

async function logActivity(action, entity, label, details){
  if(!db || !currentAccount) return;
  try{
    await db.collection('activity_log').add({
      ts: Date.now(),
      username: currentAccount.username,
      displayName: currentAccount.displayName || currentAccount.username,
      action, entity, label: label||'', details: details||''
    });
  }catch(e){ console.error(e); }
}

async function init(){
  if(!API_URL || !API_TOKEN){ renderConnGate(); return; }
  await connectAndStart();
}

function renderConnGate(){
  $('#gateSub').textContent = L('conn_gate_sub');
  $('#gateForm').innerHTML = `
    <label>${L('conn_url_label')}</label><input id="g-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <label>${L('conn_token_label')}</label><input id="g-token" type="password" autocomplete="off">
    <button class="btn btn-primary" id="g-connect" style="margin-top:14px;width:100%">${L('conn_connect_btn')}</button>
    <div class="gate-err" id="gateErr"></div>`;
  $('#g-connect').onclick=async()=>{
    const url = ($('#g-url').value||'').trim();
    const token = ($('#g-token').value||'').trim();
    if(!url||!token){ $('#gateErr').textContent=L('gate_err_required'); return; }
    API_URL = url; API_TOKEN = token;
    $('#gateSub').textContent = L('conn_connecting');
    $('#gateForm').innerHTML = '';
    const ok = await loadAllAndNotify();
    if(!ok){
      localStorage.removeItem('eshleil_api_url'); localStorage.removeItem('eshleil_api_token');
      API_URL=''; API_TOKEN='';
      renderConnGate();
      return;
    }
    localStorage.setItem('eshleil_api_url', url);
    localStorage.setItem('eshleil_api_token', token);
    await connectAndStart();
  };
}

async function connectAndStart(){
  db = makeDbShim();

  db.collection('app_users').onSnapshot(s=>{
    appUsers = s.docs.map(d=>({id:d.id,...d.data()}));
    accountsLoaded = true;
    if(!currentAccount){ tryResumeSession(); }
    else { renderAcctList(); }
  });

  db.collection('products').onSnapshot(s=>{ products=s.docs.map(d=>({id:d.id,...d.data()})); render(); });
  db.collection('clients').onSnapshot(s=>{ clients=s.docs.map(d=>({id:d.id,...d.data()})); render(); });
  db.collection('quotes').onSnapshot(s=>{ quotes=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); render(); });
  db.collection('activity_log').onSnapshot(s=>{ activityLog=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0)); if(tab==='activity') render(); });
  db.doc('settings/company').onSnapshot(d=>{
    if(d.exists){ settings={...settings, ...d.data()}; applySettings(); updateChrome(); render(); }
  });

  await loadAllAndNotify();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(loadAllAndNotify, 20000);
}

function tryResumeSession(){
  const savedUsername = localStorage.getItem('eshleil_username');
  if(savedUsername){
    const acct = appUsers.find(a=>a.username.toLowerCase()===savedUsername.toLowerCase());
    if(acct){ signIn(acct); return; }
    localStorage.removeItem('eshleil_username');
  }
  renderGate();
}

function renderGate(){
  if(!appUsers.length){
    $('#gateSub').textContent = L('gate_setup_sub');
    $('#gateForm').innerHTML = `
      <label>${L('gate_display_name')}</label><input id="g-display" autocomplete="off">
      <label>${L('gate_username')}</label><input id="g-username" autocomplete="off">
      <label>${L('gate_password')}</label><input id="g-password" type="password" autocomplete="new-password">
      <button class="btn btn-primary" id="g-submit" style="margin-top:14px;width:100%">${L('gate_create_btn')}</button>
      <div class="gate-err" id="g-err"></div>`;
    $('#g-submit').onclick=async()=>{
      const display=$('#g-display').value.trim(), username=$('#g-username').value.trim(), password=$('#g-password').value;
      if(!display||!username||!password){ $('#g-err').textContent=L('gate_err_required'); return; }
      const data = {displayName:display, username, password, isAdmin:true};
      const ref = await db.collection('app_users').add(data);
      signIn({id:ref.id, ...data});
    };
  } else {
    $('#gateSub').textContent = L('gate_login_sub');
    $('#gateForm').innerHTML = `
      <label>${L('gate_username')}</label><input id="g-username" autocomplete="username">
      <label>${L('gate_password')}</label><input id="g-password" type="password" autocomplete="current-password">
      <button class="btn btn-primary" id="g-submit" style="margin-top:14px;width:100%">${L('gate_login_btn')}</button>
      <div class="gate-err" id="g-err"></div>`;
    $('#g-submit').onclick=doLoginAttempt;
    $('#g-password').onkeydown=(e)=>{ if(e.key==='Enter') doLoginAttempt(); };
  }
}

function doLoginAttempt(){
  const username=($('#g-username').value||'').trim(), password=$('#g-password').value;
  if(!username||!password){ $('#g-err').textContent=L('gate_err_required'); return; }
  const acct = appUsers.find(a=>a.username.toLowerCase()===username.toLowerCase() && a.password===password);
  if(!acct){ $('#g-err').textContent=L('gate_err_invalid'); return; }
  signIn(acct);
}

function signIn(acct){
  currentAccount = acct;
  localStorage.setItem('eshleil_username', acct.username);
  $('#sideName').textContent = acct.displayName || acct.username;
  $('#sideRole').textContent = acct.isAdmin ? L('acct_admin_badge') : L('acct_member_badge');
  $('#sideAvatar').textContent = (acct.displayName||acct.username||'U').trim().charAt(0).toUpperCase() || 'U';
  $('#gate').style.display='none';
  $('#appShell').classList.remove('hidden-app');
  renderNav();
  render();
  logActivity('login','session', acct.displayName||acct.username);
}

function doLogout(){
  logActivity('logout','session', currentAccount?(currentAccount.displayName||currentAccount.username):'');
  currentAccount = null;
  localStorage.removeItem('eshleil_username');
  $('#appShell').classList.add('hidden-app');
  $('#gate').style.display='flex';
  renderNav();
  if(tab==='activity') tab='dashboard';
  renderGate();
}

function applySettings(){
  document.querySelectorAll('.logo-text').forEach(el=>el.textContent=settings.name);
  document.querySelectorAll('.foot').forEach(el=>el.textContent='© 2026 '+settings.name+'. '+L('footer_rights'));
}

function render(){
  const navItem = NAV.find(n=>n.id===tab);
  $('#pageTitle').textContent = L(navItem.key);
  $('#fab').classList.toggle('hide', !['stock','clients','quotes'].includes(tab));
  $('#fab').onclick = ()=>{ if(tab==='stock') openProductForm(); else if(tab==='clients') openClientForm(); else if(tab==='quotes') openQuoteForm(); };
  const c = $('#content');
  if(tab==='dashboard') c.innerHTML = renderDashboard();
  else if(tab==='stock') c.innerHTML = renderStock();
  else if(tab==='clients') c.innerHTML = renderClients();
  else if(tab==='quotes') c.innerHTML = renderQuotes();
  else if(tab==='sales'){ c.innerHTML = renderSales(); bindSalesHandlers(); }
  else if(tab==='reports'){ c.innerHTML = renderReports(); bindReportsHandlers(); }
  else if(tab==='activity'){ c.innerHTML = renderActivity(); bindActivityHandlers(); }
  else if(tab==='settings'){ c.innerHTML = renderSettings(); bindSettingsHandlers(); }
  bindListHandlers();
}

    <div class="stat"><div class="ic">${ICONS.cart}</div><div class="lbl">${L('sales_total_label')}</div><div class="val">${money(total)}</div><div class="sub2">${sales.length} ${L('unit_sale_paren')}</div></div>

function bindSalesHandlers(){
  const btn = $('#sale-confirm');
  if(!btn) return;
  btn.onclick = async()=>{
    const term = ($('#sale-number').value||'').trim().toLowerCase();
    const msg = $('#sale-msg');
    if(!term){ msg.textContent=L('sales_msg_need_number'); msg.style.color='var(--danger)'; return; }
    const q = quotes.find(qq=>(qq.number||'').toLowerCase()===term);
    if(!q){ msg.textContent=L('sales_msg_not_found'); msg.style.color='var(--danger)'; return; }
    if(q.stockApplied){ msg.textContent=L('sales_msg_already'); msg.style.color='var(--sub)'; return; }
    btn.disabled = true; msg.textContent=L('sales_msg_progress'); msg.style.color='var(--sub)';
    try{
      await applyStockForQuote(q.items||[]);
      await db.doc('quotes/'+q.id).update({status:'accepted', stockApplied:true});
      logActivity('sale','quote', q.number);
      await markPaidAndDownloadReceipt({...q, status:'accepted', stockApplied:true});
      msg.textContent=L('sales_msg_success')+' '+(q.number||'')+'. '+L('sales_msg_success_suffix')+' '+L('sales_msg_receipt_suffix');
      msg.style.color='var(--good)';
      $('#sale-number').value='';
    }catch(e){
      console.error(e);
      msg.textContent=L('sales_msg_error');
      msg.style.color='var(--danger)';
    }
    btn.disabled = false;
  };
}

async function applyStockForQuote(items){
  for(const it of (items||[])){
    if(!it.productId) continue;
    const p = products.find(pp=>pp.id===it.productId);
    const current = p ? (p.stock||0) : 0;
    const newStock = current - (it.qty||1);
    await db.doc('products/'+it.productId).update({stock:newStock});
  }
}

async function saveFile(filename, blob){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }catch(e){ console.error(e); alert(L('download_fail')+' '+(e.message||e)); }
}

function exportReportsExcel(){
  if(typeof XLSX==='undefined'){ alert(L('excel_lib_fail')); return; }
  const wb = XLSX.utils.book_new();
  const dloc = settings.lang==='en'?'en-GB':'fr-FR';
  const filteredQuotes = reportFilteredQuotes();
  const periodLabel = (reportFrom||reportTo) ? ((reportFrom||'…')+' → '+(reportTo||'…')) : L('reports_period_all');

  const stockValue = products.reduce((s,p)=>s+(p.stock||0)*(p.price||0),0);
  const accepted = filteredQuotes.filter(q=>q.status==='accepted');
  const pending = filteredQuotes.filter(q=>q.status!=='accepted');
  const salesValue = accepted.reduce((s,q)=>s+(q.total||0),0);
  const profitValue = accepted.reduce((s,q)=>s+quoteProfit(q),0);
  const pendingValue = pending.reduce((s,q)=>s+(q.total||0),0);
  const lowStock = lowStockList();

  const summary = [
    [L('xlsx_report'), settings.name],
    [L('reports_period'), periodLabel],
    [L('xlsx_date'), new Date().toLocaleDateString(dloc)],
    [],
    [L('xlsx_indicator'), L('xlsx_value')],
    [L('xlsx_total_stock_units'), totalStock],
    [L('xlsx_stock_value'), stockValue],
    [L('xlsx_accepted_sales'), salesValue],
    [L('xlsx_profit_total'), profitValue],
    [L('xlsx_sales_count'), accepted.length],
    [L('stat_quotes_pending'), pending.length],
    [L('stat_value')+' ('+L('stat_quotes_pending')+')', pendingValue],
    [L('xlsx_clients'), clients.length],
    [L('xlsx_quotes_total'), filteredQuotes.length],
    [L('stat_stock_low'), lowStock.length],
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), L('xlsx_sheet_summary'));

  const stockRows = [[L('xlsx_product'),L('xlsx_category'),L('form_unit'),L('xlsx_sku'),L('xlsx_stock'),L('xlsx_cost_price'),L('xlsx_price'),L('xlsx_profit'),L('xlsx_value'),L('th_alert')]].concat(
    products.map(p=>[p.name||'', p.category||'', unitLabel(p.unit), p.sku||'', p.stock||0, p.costPrice||0, p.price||0, (p.price||0)-(p.costPrice||0), (p.stock||0)*(p.price||0), ((p.stock||0)<=(p.lowAt!=null?p.lowAt:settings.lowStockDefault))?L('yes'):L('no')])
  );
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stockRows), L('xlsx_sheet_stock'));

  const catRows = [[L('xlsx_category'),L('xlsx_qty'),L('xlsx_value')]].concat(
    categoryBreakdown().map(([cat,d])=>[cat, d.qty, d.value])
  );
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(catRows), L('xlsx_sheet_categories'));

  const lowStockRows = [[L('xlsx_product'),L('xlsx_category'),L('xlsx_stock'),L('xlsx_threshold')]].concat(
    lowStock.map(p=>[p.name||'', p.category||'', (p.stock||0)+' '+unitLabel(p.unit), (p.lowAt!=null?p.lowAt:settings.lowStockDefault)+' '+unitLabel(p.unit)])
  );
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(lowStockRows), L('xlsx_sheet_lowstock'));

  const pendingRows = [[L('xlsx_number'),L('xlsx_client'),L('xlsx_status'),L('xlsx_items'),L('xlsx_total'),L('xlsx_date')]].concat(
    pending.map(q=>{ const cl=clients.find(c=>c.id===q.clientId); return [q.number||'', cl?cl.name:'', statusLabel(q.status), (q.items||[]).length, q.total||0, q.createdAt?new Date(q.createdAt).toLocaleDateString(dloc):'']; })
  );
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pendingRows), L('xlsx_sheet_pending'));

  const salesRows = [[L('xlsx_number'),L('xlsx_client'),L('xlsx_items'),L('xlsx_total'),L('xlsx_profit'),L('xlsx_paid'),L('xlsx_receipt'),L('xlsx_date')]].concat(
    accepted.map(q=>{ const cl=clients.find(c=>c.id===q.clientId); return [q.number||'', cl?cl.name:'', (q.items||[]).length, q.total||0, quoteProfit(q), q.paid?L('yes'):L('no'), q.receiptNumber||'', q.createdAt?new Date(q.createdAt).toLocaleDateString(dloc):'']; })
  );
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(salesRows), L('xlsx_sheet_sales'));

  const clientRows = [[L('xlsx_name'),L('xlsx_email'),L('xlsx_phone'),L('xlsx_notes')]].concat(
    clients.map(c=>[c.name||'', c.email||'', c.phone||'', c.notes||''])
  );
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(clientRows), L('xlsx_sheet_clients'));

  const quoteRows = [[L('xlsx_number'),L('xlsx_client'),L('xlsx_status'),L('xlsx_items'),L('xlsx_subtotal'),L('xlsx_discount'),L('xlsx_tax'),L('xlsx_total'),L('xlsx_date')]].concat(
    filteredQuotes.map(q=>{
      const cl = clients.find(c=>c.id===q.clientId);
      const subtotal = q.subtotal!=null?q.subtotal:(q.items||[]).reduce((s,it)=>s+(it.price||0)*(it.qty||1),0);
      const discount = q.discountAmt!=null?q.discountAmt:0;

      return [q.number||'', cl?cl.name:'', statusLabel(q.status), (q.items||[]).length, subtotal, discount, tax, q.total||0, q.createdAt?new Date(q.createdAt).toLocaleDateString(dloc):''];
    })
  );
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(quoteRows), L('xlsx_sheet_quotes'));

  const wbArray = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const blob = new Blob([wbArray], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  saveFile('rapport-'+reportFilenameSuffix()+'.xlsx', blob);
}

async function exportReportsPdf(){

  const doc = new jsPDF({unit:'pt',format:'a4'});

  doc.setFontSize(18); doc.setFont(undefined,'bold'); doc.text(settings.name, marginX, y); y+=18;
  doc.setFontSize(10); doc.setFont(undefined,'normal'); doc.text(L('pdf_report_title')+' — '+new Date().toLocaleDateString(dloc), marginX, y); y+=14;
  doc.setFontSize(9); doc.setTextColor(110); doc.text(L('reports_period')+': '+periodLabel, marginX, y); doc.setTextColor(0); y+=24;

  const totalStock = products.reduce((s,p)=>s+(p.stock||0),0);
  const stockValue = products.reduce((s,p)=>s+(p.stock||0)*(p.price||0),0);
  const accepted = filteredQuotes.filter(q=>q.status==='accepted');
  const pending = filteredQuotes.filter(q=>q.status!=='accepted');
  const salesValue = accepted.reduce((s,q)=>s+(q.total||0),0);
  const profitValue = accepted.reduce((s,q)=>s+quoteProfit(q),0);
  const pendingValue = pending.reduce((s,q)=>s+(q.total||0),0);
  const lowStock = lowStockList();
  const catBreakdown = categoryBreakdown();

  function ensureRoom(need){ if(y+need>780){ doc.addPage(); y=56; } }
  function sectionTitle(text){ ensureRoom(24); doc.setFont(undefined,'bold'); doc.setFontSize(12); doc.text(text, marginX, y); y+=16; }

  sectionTitle(L('pdf_report_summary'));
  doc.setFont(undefined,'normal'); doc.setFontSize(10.5);
  [
    [L('pdf_report_stock_total'), totalStock+' '+L('pdf_units')],
    [L('pdf_report_stock_value'), money(stockValue)],
    [L('pdf_report_sales_accepted'), money(salesValue)+' ('+accepted.length+' '+L('pdf_sales_paren')+')'],
    [L('pdf_report_profit'), money(profitValue)],
    [L('stat_quotes_pending'), money(pendingValue)+' ('+pending.length+' '+L('unit_quotes')+')'],
    [L('pdf_report_clients'), String(clients.length)],
    [L('pdf_report_quotes_total'), String(filteredQuotes.length)],
    [L('stat_stock_low'), String(lowStock.length)],
  ].forEach(row=>{ ensureRoom(16); doc.text(row[0]+':', marginX, y); doc.text(row[1], 240, y); y+=16; });
  y+=10;

  sectionTitle(L('reports_category_breakdown'));
  doc.setFont(undefined,'normal'); doc.setFontSize(10);
  if(!catBreakdown.length){ doc.text(L('stock_empty'), marginX, y); y+=15; }
  else{
    doc.setFont(undefined,'bold'); doc.text(L('th_category'), marginX, y); doc.text(L('th_qty'), 300, y); doc.text(L('stat_value'), 400, y); y+=6;
    doc.line(marginX,y,545,y); y+=13; doc.setFont(undefined,'normal');

let stockCategory='';
const DEFAULT_CATEGORIES=['Légumes','Peinture','Papier','Sandales'];
function currentCategories(){ return (settings.categories && settings.categories.length) ? settings.categories : DEFAULT_CATEGORIES; }
const UNIT_OPTIONS=[{value:'unit',fr:'Unité',en:'Unit'},{value:'kg',fr:'Kg',en:'Kg'}];
function unitLabel(v){ const o = UNIT_OPTIONS.find(u=>u.value===v) || UNIT_OPTIONS[0]; return o[settings.lang]||o.fr; }
function statusLabel(s){ return L('status_'+(s||'draft')); }
function itemDisplayName(it){ return it.name + (it.size ? ' ('+it.size+')' : ''); }
function itemProfit(it){ return ((it.price||0)-(it.costPrice||0)) * (it.qty||1) * (1-(it.discount||0)/100); }
function quoteProfit(q){ return (q.items||[]).reduce((s,it)=>s+itemProfit(it),0); }
function quoteCost(q){ return (q.items||[]).reduce((s,it)=>s+((it.costPrice||0)*(it.qty||1)*(1-(it.discount||0)/100)),0); }

let reportFrom='', reportTo='';
function quoteInReportRange(q){
  if(!reportFrom && !reportTo) return true;
  if(!q.createdAt) return false;
  const ts = q.createdAt;
  if(reportFrom && ts < new Date(reportFrom+'T00:00:00').getTime()) return false;
  if(reportTo && ts > new Date(reportTo+'T23:59:59').getTime()) return false;
  return true;
}
function reportFilteredQuotes(){ return quotes.filter(quoteInReportRange); }
function reportFilenameSuffix(){ return (reportFrom||reportTo) ? (reportFrom||'…')+'_'+(reportTo||'…') : new Date().toISOString().slice(0,10); }
function categoryBreakdown(){
  const map = {};
  products.forEach(p=>{
    const cat = p.category || L('cat_uncategorized');
    if(!map[cat]) map[cat] = {qty:0, value:0};
    map[cat].qty += (p.stock||0);
    map[cat].value += (p.stock||0)*(p.price||0);
  });
  return Object.entries(map).sort((a,b)=>b[1].value-a[1].value);
}
function lowStockList(){ return products.filter(p=>(p.stock||0)<=(p.lowAt!=null?p.lowAt:settings.lowStockDefault)); }

function renderStock(){
  const chips = `<div class="export-row">
      <button class="btn btn-sm ${stockCategory===''?'btn-primary':''}" data-cat="">${L('stock_all')}</button>
      ${currentCategories().map(c=>`<button class="btn btn-sm ${stockCategory===c?'btn-primary':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>`;
  const filtered = stockCategory ? products.filter(p=>p.category===stockCategory) : products;
  if(!products.length) return chips + `<div class="empty">${L('stock_empty')}</div>`;
  if(!filtered.length) return chips + `<div class="empty">${L('stock_empty_category')}</div>`;
  return chips + filtered.map(p=>`
    <div class="item-card" data-edit="product" data-id="${p.id}">
      <div class="row">
        <div><div class="name">${esc(p.name)}${p.size?` <span class="sub2">(${esc(p.size)})</span>`:''}</div><div class="sub">${p.category?esc(p.category)+' · ':''}${esc(p.sku||'')} · ${money(p.price)}</div></div>

      </div>
    </div>`).join('');
}
function renderClients(){

}
function renderQuotes(){
  const term = quoteSearch.trim().toLowerCase();
  const filtered = term ? quotes.filter(q=>{
    const client = clients.find(c=>c.id===q.clientId);
    return (q.number||'').toLowerCase().includes(term) || (client&&client.name.toLowerCase().includes(term));
  }) : quotes;
  const searchBar = `<div class="card" style="padding:10px 12px;margin-bottom:12px">
      <input id="q-search" placeholder="${L('quotes_search_placeholder')}" value="${esc(quoteSearch)}">
    </div>`;
  if(!quotes.length) return searchBar + `<div class="empty">${L('quotes_empty')}</div>`;
  if(!filtered.length) return searchBar + `<div class="empty">${L('quotes_no_results')} "${esc(quoteSearch)}".</div>`;
  return searchBar + filtered.map(q=>{
    const client = clients.find(c=>c.id===q.clientId);
    const discAmt = q.discountAmt||0;
    return `<div class="item-card">
      <div class="row" data-edit="quote" data-id="${q.id}" style="cursor:pointer">
        <div><div class="name">${esc(q.number||'—')}</div><div class="sub">${esc(client?client.name:L('no_client'))}</div></div>

      </div>
      <div class="row" style="margin-top:6px">
        <div class="qsum">${(q.items||[]).length} ${L('th_items')} · ${money(q.total)}${discAmt>0.004?` <span style="color:var(--good)">(-${money(discAmt)} ${L('discount_suffix')})</span>`:''}</div>
        <button class="btn btn-sm" data-pdf="${q.id}">PDF</button>
      </div>
    </div>`;
  }).join('');
}
function bindListHandlers(){
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.id, type=el.dataset.edit;
      if(type==='product') openProductForm(products.find(p=>p.id===id));
      if(type==='client') openClientForm(clients.find(c=>c.id===id));
      if(type==='quote') openQuoteForm(quotes.find(q=>q.id===id));
    };
  });
  const qs = $('#q-search');
  if(qs){
    qs.oninput = ()=>{ quoteSearch = qs.value; $('#content').innerHTML = renderQuotes(); bindListHandlers(); qs.focus(); qs.setSelectionRange(qs.value.length,qs.value.length); };
  }
  document.querySelectorAll('[data-pdf]').forEach(btn=>{
    btn.onclick=(e)=>{ e.stopPropagation(); downloadQuotePdf(quotes.find(q=>q.id===btn.dataset.pdf)); };
  });
  document.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.onclick=()=>{ stockCategory = btn.dataset.cat; $('#content').innerHTML = renderStock(); bindListHandlers(); };
  });
}

function openQuoteForm(q){
  const items = q? JSON.parse(JSON.stringify(q.items||[])) : [{productId:'',qty:1}];
  const clientOpts = clients.map(c=>`<option value="${c.id}" ${q&&q.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const prodOpts = pid=>products.map(p=>`<option value="${p.id}" ${pid===p.id?'selected':''}>${p.sku?esc(p.sku)+' — ':''}${esc(p.name)}${p.size?' ('+esc(p.size)+')':''} (${money(p.price)})</option>`).join('');
  showSheet(`<h2>${q?L('form_edit_quote'):L('form_new_quote')}</h2>
    <div class="sub" style="margin-bottom:6px">${q?esc(q.number||''):L('quote_number_pending')}</div>
    <label>${L('form_client')}</label><select id="f-client"><option value="">${L('select_client_placeholder')}</option>${clientOpts}</select>
    <label>${L('form_items')}</label><div id="f-items"></div>
    <button class="btn btn-sm" id="f-additem" style="margin-top:8px">${L('btn_add_item')}</button>
    <label>${L('quote_notes_label')}</label><textarea id="f-quote-notes" rows="2" placeholder="${L('quote_notes_placeholder')}">${q?esc(q.notes||''):''}</textarea>
    <div class="qsum" id="f-subtotal">${L('label_subtotal')}: Rs 0</div>
    <div class="qsum" id="f-discount"></div>
    <div class="qsum" id="f-tax"></div>
    <div class="qsum" id="f-total" style="font-weight:700;color:var(--ink)">${L('label_total')}: Rs 0</div>
    ${q? `<div class="sub" style="margin-top:8px">${q.paid?(L('paid_on')+' '+(q.paidAt?new Date(q.paidAt).toLocaleDateString(settings.lang==='en'?'en-GB':'fr-FR'):'')+' — '+L('receipt_word')+' '+(q.receiptNumber||'')):L('not_paid')}</div>
    <div class="export-row" style="margin-top:10px">
      <button class="btn btn-sm" id="f-pdf-devis">${L('btn_devis_pdf')}</button>
      <button class="btn btn-sm" id="f-pdf-proforma">${L('btn_proforma_pdf')}</button>
      ${q.paid?`<button class="btn btn-sm" id="f-pdf-receipt">${L('btn_receipt_pdf')}</button>`:`<button class="btn btn-sm btn-primary" id="f-mark-paid">${L('btn_mark_paid')}</button>`}
    </div>` : ''}
    <div class="sheet-actions">
      ${(q&&currentAccount&&currentAccount.isAdmin)?`<button class="btn btn-danger" id="f-del">${L('btn_delete')}</button>`:''}
      <button class="btn" id="f-cancel">${L('btn_cancel')}</button><button class="btn btn-primary" id="f-save">${L('btn_save')}</button>
    </div>`);
  function renderItems(){
    $('#f-items').innerHTML = `<div class="item-row" style="font-size:11px;color:var(--sub);margin-top:0"><span style="flex:2.4">${L('th_product')}</span><span style="flex:1">${L('th_qty_short')}</span><span style="width:30px"></span><span style="flex:1" class="it-disc">${L('th_discount_pct')}</span><span style="width:26px"></span></div>` +
      items.map((it,i)=>{ const p=products.find(pp=>pp.id===it.productId); return `<div class="item-row" data-i="${i}">
      <select class="it-prod">${'<option value="">'+L('select_product_placeholder')+'</option>'+prodOpts(it.productId)}</select>
      <input class="it-qty" type="number" min="0.01" step="0.01" value="${it.qty||1}">
      <span class="sub2" style="width:30px;text-align:center">${p?unitLabel(p.unit):''}</span>
      <input class="it-disc" type="number" min="0" max="100" placeholder="0" value="${it.discount||''}">
      <button class="btn btn-sm it-rm" type="button">✕</button></div>`; }).join('');
    $('#f-items').querySelectorAll('.item-row[data-i]').forEach(row=>{
      const i=+row.dataset.i;
      row.querySelector('.it-prod').onchange=e=>{ items[i].productId=e.target.value; renderItems(); calcTotal(); };
      row.querySelector('.it-qty').oninput=e=>{ items[i].qty=parseFloat(e.target.value)||1; calcTotal(); };
      row.querySelector('.it-disc').oninput=e=>{ items[i].discount=Math.min(100,Math.max(0,parseFloat(e.target.value)||0)); calcTotal(); };
      row.querySelector('.it-rm').onclick=()=>{ items.splice(i,1); renderItems(); calcTotal(); };
    });
  }
  function calcTotal(){
    let subtotal=0, discountAmt=0;
    items.forEach(it=>{
      const p=products.find(pp=>pp.id===it.productId);
      const base=(p?p.price:0)*(it.qty||1);
      subtotal += base;
      discountAmt += base*((it.discount||0)/100);
    });
    const taxRate = settings.taxRate||0;
    const afterDiscount = subtotal - discountAmt;
    const taxAmt = afterDiscount * (taxRate/100);
    const total = afterDiscount + taxAmt;
    $('#f-subtotal').textContent = L('label_subtotal')+': '+money(subtotal);
    $('#f-discount').textContent = discountAmt>0 ? L('label_total_discount')+': -'+money(discountAmt) : '';
    $('#f-tax').textContent = taxRate>0 ? L('label_tax_vat')+' ('+taxRate+'%): '+money(taxAmt) : '';
    $('#f-total').textContent=L('label_total')+': '+money(total);
    return {subtotal, discountAmt, taxAmt, taxRate, total};
  }
  renderItems(); calcTotal();
  $('#f-additem').onclick=()=>{ items.push({productId:'',qty:1}); renderItems(); calcTotal(); };
  $('#f-cancel').onclick=closeSheet;
  if(q){
    if(currentAccount && currentAccount.isAdmin){
      $('#f-del').onclick=async()=>{ await db.doc('quotes/'+q.id).delete(); logActivity('delete','quote', q.number); closeSheet(); };
    }
    $('#f-pdf-devis').onclick=()=>downloadQuotePdf(q);
    $('#f-pdf-proforma').onclick=()=>downloadProformaPdf(q);
    if(q.paid){ $('#f-pdf-receipt').onclick=()=>downloadReceiptPdf(q); }
    else { $('#f-mark-paid').onclick=async()=>{ await markPaidAndDownloadReceipt(q); closeSheet(); }; }
  }
  $('#f-save').onclick=async()=>{
    const cleanItems=items.filter(it=>it.productId).map(it=>{ const p=products.find(pp=>pp.id===it.productId); return {productId:it.productId,name:p?p.name:'',size:p?(p.size||''):'',price:p?p.price:0,costPrice:p?(p.costPrice||0):0,unit:p?p.unit:'unit',qty:it.qty||1,discount:it.discount||0}; });
    const breakdown = calcTotal();
    const wasStockApplied = q ? !!q.stockApplied : false;
    const data={
      clientId:$('#f-client').value, items:cleanItems, status: q?(q.status||'draft'):'draft', notes:$('#f-quote-notes').value.trim(),
      subtotal:breakdown.subtotal, discountAmt:breakdown.discountAmt, taxRate:breakdown.taxRate, taxAmt:breakdown.taxAmt, total:breakdown.total,
      createdAt:q?(q.createdAt||Date.now()):Date.now()
    };
    let quoteId = q ? q.id : null;
    if(q){ await db.doc('quotes/'+q.id).update(data); logActivity('update','quote', q.number); }
    else { data.number = nextQuoteNumber(); const ref = await db.collection('quotes').add(data); quoteId = ref.id; logActivity('create','quote', data.number); }
    if(data.status==='accepted' && !wasStockApplied){
      await applyStockForQuote(cleanItems);
      await db.doc('quotes/'+quoteId).update({stockApplied:true});
    }
    closeSheet();
  };
}

function nextQuoteNumber(){
  let max=0;
  quotes.forEach(q=>{ const m=(q.number||'').match(/(\d+)$/); if(m) max=Math.max(max,parseInt(m[1],10)); });
  return (settings.quotePrefix||'Q-')+String(max+1).padStart(4,'0');
}

async function downloadQuotePdf(q){
  if(!q) return;
  if(typeof window.jspdf==='undefined'){ alert(L('pdf_lib_fail')); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt',format:'a4'});
  const dloc = settings.lang==='en'?'en-GB':'fr-FR';
  const client = clients.find(c=>c.id===q.clientId);
  const marginX = 48; let y = 56;
  doc.setFontSize(18); doc.setFont(undefined,'bold'); doc.text(settings.name, marginX, y);
  doc.setFontSize(9); doc.setFont(undefined,'normal'); y+=16;
  [settings.address, settings.phone, settings.email].filter(Boolean).forEach(line=>{ doc.text(line, marginX, y); y+=12; });
  y = Math.max(y, 74);
  doc.setFontSize(10); doc.text(L('pdf_quote_title'), marginX, y); y+=26;
  doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text(L('pdf_number')+': '+(q.number||'—'), marginX, y);
  doc.text(L('pdf_status')+': '+statusLabel(q.status), 340, y); y+=16;
  doc.setFont(undefined,'normal');
  const created = q.createdAt?new Date(q.createdAt):null;
  doc.text(L('pdf_date')+': '+(created?created.toLocaleDateString(dloc):'—'), marginX, y);
  if(created && settings.quoteValidity){
    const validUntil = new Date(created.getTime() + settings.quoteValidity*86400000);
    doc.text(L('pdf_valid_until')+': '+validUntil.toLocaleDateString(dloc), 340, y);
  }
  y+=24;
  doc.setFont(undefined,'bold'); doc.text(L('pdf_client'), marginX, y); y+=14;
  doc.setFont(undefined,'normal');
  doc.text(client?client.name:'—', marginX, y); y+=14;
  if(client && client.email){ doc.text(client.email, marginX, y); y+=14; }
  if(client && client.phone){ doc.text(client.phone, marginX, y); y+=14; }
  y+=16;
  doc.setFont(undefined,'bold');
  doc.text(L('pdf_article'), marginX, y); doc.text(L('pdf_qty'), 290, y); doc.text(L('pdf_price'), 340, y); doc.text(L('pdf_discount'), 410, y); doc.text(L('pdf_total'), 480, y);
  y+=8; doc.setLineWidth(0.5); doc.line(marginX, y, 545, y); y+=16;
  doc.setFont(undefined,'normal');
  (q.items||[]).forEach(it=>{
    const disc = it.discount||0;
    const lineTotal = (it.price||0)*(it.qty||1)*(1-disc/100);
    doc.text(itemDisplayName(it), marginX, y);
    doc.text(String(it.qty||1)+' '+unitLabel(it.unit), 290, y);
    doc.text(money(it.price), 340, y);
    doc.text(disc?disc+'%':'—', 410, y);
    doc.text(money(lineTotal), 480, y);
    y+=18;
    if(y>720){ doc.addPage(); y=56; }
  });
  y+=8; doc.line(marginX, y, 545, y); y+=18;
  const subtotal = q.subtotal!=null?q.subtotal:(q.items||[]).reduce((s,it)=>s+(it.price||0)*(it.qty||1),0);
  const discountAmt = q.discountAmt||0;
  const taxAmt = q.taxAmt||0;
  doc.setFontSize(10.5); doc.setFont(undefined,'normal');
  doc.text(L('pdf_subtotal')+': '+money(subtotal), 400, y); y+=15;
  if(discountAmt>0.004){ doc.text(L('pdf_total_discount')+': -'+money(discountAmt), 400, y); y+=15; }
  if(taxAmt>0.004){ doc.text(L('pdf_vat')+' ('+(q.taxRate||0)+'%): '+money(taxAmt), 400, y); y+=15; }
  doc.setFont(undefined,'bold'); doc.setFontSize(13);
  doc.text(L('pdf_total')+': '+money(q.total), 400, y);
  y+=30;
  if(q.notes){
    doc.setFont(undefined,'bold'); doc.setFontSize(9); doc.setTextColor(0);
    doc.text(L('quote_notes_label')+':', marginX, y); y+=13;
    doc.setFont(undefined,'normal'); doc.setTextColor(80);
    const noteLines = doc.splitTextToSize(q.notes, 497);
    if(y + noteLines.length*11 > 780){ doc.addPage(); y=56; }
    doc.text(noteLines, marginX, y); y += noteLines.length*11 + 8;
    doc.setTextColor(0);
  }
  if(settings.terms){
    doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(110);
    const lines = doc.splitTextToSize(settings.terms, 497);
    if(y + lines.length*11 > 780){ doc.addPage(); y=56; }
    doc.text(lines, marginX, y);
    doc.setTextColor(0);
  }
  await saveDocBlob((q.number||'devis')+'.pdf', doc);
  if((!q.status || q.status==='draft') && db){
    try{ await db.doc('quotes/'+q.id).update({status:'sent'}); }catch(e){ console.error(e); }
  }
}

async function saveDocBlob(filename, doc){
  try{ doc.save(filename); }
  catch(e){ console.error(e); alert(L('pdf_save_fail')+' '+(e.message||e)); }
}

function nextReceiptNumber(){
  let max=0;
  quotes.forEach(q=>{ const m=(q.receiptNumber||'').match(/(\d+)$/); if(m) max=Math.max(max,parseInt(m[1],10)); });
  return 'R-'+String(max+1).padStart(4,'0');
}

async function markPaidAndDownloadReceipt(q){
  if(!q) return;
  let receiptNumber = q.receiptNumber, paidAt = q.paidAt;
  if(!q.paid){
    receiptNumber = nextReceiptNumber();
    paidAt = Date.now();
    try{ await db.doc('quotes/'+q.id).update({paid:true, paidAt, receiptNumber}); logActivity('paid','quote', q.number); }
    catch(e){ console.error(e); alert(L('mark_paid_fail')); return; }
  }
  await downloadReceiptPdf({...q, paid:true, paidAt, receiptNumber});
}

  }
  y+=24;
  doc.setFont(undefined,'bold'); doc.text(L('pdf_client'), marginX, y); y+=14;
  doc.setFont(undefined,'normal');
  doc.text(client?client.name:'—', marginX, y); y+=14;
  if(client && client.email){ doc.text(client.email, marginX, y); y+=14; }
  if(client && client.phone){ doc.text(client.phone, marginX, y); y+=14; }
  y+=16;
  doc.setFont(undefined,'bold');
  doc.text(L('pdf_article'), marginX, y); doc.text(L('pdf_qty'), 290, y); doc.text(L('pdf_price'), 340, y); doc.text(L('pdf_discount'), 410, y); doc.text(L('pdf_total'), 480, y);
  y+=8; doc.setLineWidth(0.5); doc.line(marginX, y, 545, y); y+=16;
  doc.setFont(undefined,'normal');
  (q.items||[]).forEach(it=>{
    const disc = it.discount||0;
    const lineTotal = (it.price||0)*(it.qty||1)*(1-disc/100);
    doc.text(itemDisplayName(it), marginX, y);
    doc.text(String(it.qty||1)+' '+unitLabel(it.unit), 290, y);
    doc.text(money(it.price), 340, y);
    doc.text(disc?disc+'%':'—', 410, y);
    doc.text(money(lineTotal), 480, y);
    y+=18;
    if(y>700){ doc.addPage(); y=56; }
  });
  y+=8; doc.line(marginX, y, 545, y); y+=18;
  const subtotal = q.subtotal!=null?q.subtotal:(q.items||[]).reduce((s,it)=>s+(it.price||0)*(it.qty||1),0);
  const discountAmt = q.discountAmt||0;
  const taxAmt = q.taxAmt||0;
  doc.setFontSize(10.5); doc.setFont(undefined,'normal');
  doc.text(L('pdf_subtotal')+': '+money(subtotal), 400, y); y+=15;
  if(discountAmt>0.004){ doc.text(L('pdf_total_discount')+': -'+money(discountAmt), 400, y); y+=15; }
  if(taxAmt>0.004){ doc.text(L('pdf_vat')+' ('+(q.taxRate||0)+'%): '+money(taxAmt), 400, y); y+=15; }
  doc.setFont(undefined,'bold'); doc.setFontSize(13);
  doc.text(L('pdf_total_topay')+': '+money(q.total), 400, y);
  y+=26;
  doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(110);
  const noteLines = doc.splitTextToSize(L('pdf_proforma_note'), 497);
  if(y+noteLines.length*11>760){ doc.addPage(); y=56; }
  doc.text(noteLines, marginX, y); y += noteLines.length*11 + 8;
  if(q.notes){
    doc.setFont(undefined,'bold'); doc.setTextColor(0);
    doc.text(L('quote_notes_label')+':', marginX, y); y+=13;
    doc.setFont(undefined,'normal'); doc.setTextColor(80);
    const qNoteLines = doc.splitTextToSize(q.notes, 497);
    if(y + qNoteLines.length*11 > 780){ doc.addPage(); y=56; }
    doc.text(qNoteLines, marginX, y); y += qNoteLines.length*11 + 8;
    doc.setTextColor(110);
  }
  if(settings.terms){
    const lines = doc.splitTextToSize(settings.terms, 497);
    if(y + lines.length*11 > 780){ doc.addPage(); y=56; }
    doc.text(lines, marginX, y);
  }
  doc.setTextColor(0);
  await saveDocBlob('proforma-'+(q.number||'devis')+'.pdf', doc);
  if((!q.status || q.status==='draft') && db){
    try{ await db.doc('quotes/'+q.id).update({status:'sent'}); }catch(e){ console.error(e); }
  }
}

async function downloadReceiptPdf(q){
  if(!q) return;
  if(typeof window.jspdf==='undefined'){ alert(L('pdf_lib_fail')); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt',format:'a4'});
  const dloc = settings.lang==='en'?'en-GB':'fr-FR';
  const client = clients.find(c=>c.id===q.clientId);
  const marginX = 48; let y = 56;
  doc.setFontSize(18); doc.setFont(undefined,'bold'); doc.text(settings.name, marginX, y);
  doc.setFontSize(9); doc.setFont(undefined,'normal'); y+=16;
  [settings.address, settings.phone, settings.email].filter(Boolean).forEach(line=>{ doc.text(line, marginX, y); y+=12; });
  y = Math.max(y, 74);
  doc.setFontSize(10); doc.setFont(undefined,'bold'); doc.text(L('pdf_receipt_title'), marginX, y); y+=26;
  doc.setFontSize(11); doc.text(L('pdf_receipt_no')+': '+(q.receiptNumber||'—'), marginX, y);
  doc.setFont(undefined,'normal'); doc.text(L('pdf_ref_quote')+': '+(q.number||'—'), 340, y); y+=16;
  const paidDate = q.paidAt?new Date(q.paidAt):new Date();
  doc.text(L('pdf_payment_date')+': '+paidDate.toLocaleDateString(dloc), marginX, y); y+=24;
  doc.setFont(undefined,'bold'); doc.text(L('pdf_client'), marginX, y); y+=14;
  doc.setFont(undefined,'normal');
  doc.text(client?client.name:'—', marginX, y); y+=14;
  if(client && client.email){ doc.text(client.email, marginX, y); y+=14; }
  if(client && client.phone){ doc.text(client.phone, marginX, y); y+=14; }
  y+=16;
  doc.setFont(undefined,'bold');
  doc.text(L('pdf_article'), marginX, y); doc.text(L('pdf_qty'), 340, y); doc.text(L('pdf_total'), 480, y);
  y+=8; doc.setLineWidth(0.5); doc.line(marginX, y, 545, y); y+=16;
  doc.setFont(undefined,'normal');
  (q.items||[]).forEach(it=>{
    const disc = it.discount||0;
    const lineTotal = (it.price||0)*(it.qty||1)*(1-disc/100);
    doc.text(itemDisplayName(it), marginX, y);
    doc.text(String(it.qty||1)+' '+unitLabel(it.unit), 340, y);
    doc.text(money(lineTotal), 480, y);
    y+=18;
    if(y>700){ doc.addPage(); y=56; }
  });
  y+=8; doc.line(marginX, y, 545, y); y+=20;
  doc.setFont(undefined,'bold'); doc.setFontSize(14);
  doc.text(L('pdf_amount_paid')+': '+money(q.total), marginX, y);
  doc.setTextColor(47,107,79); doc.text(L('pdf_paid_stamp'), 470, y);
  doc.setTextColor(0);
  y+=30;
  doc.setFont(undefined,'normal'); doc.setFontSize(9); doc.setTextColor(110);
  doc.text(L('pdf_receipt_thanks'), marginX, y);
  doc.setTextColor(0);
  await saveDocBlob((q.receiptNumber||'recu')+'.pdf', doc);
}
